<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Later</title>
</head>
<body>
    <header>
        <h1>Watch Later</h1>
    </header>

    <main>
        <form id="addVideoForm">
            <label for="url">Video URL:</label>
            <input type="text" autocomplete="off" name="url" placeholder="Video URL">
            <button type="submit">Add</button>
        </form>
        <p id="formError"></p>
        <table>
            <thead>
                <tr>
                    <th>Thumbnail</th>
                    <th>Title</th>
                    <th>Channel</th>
                    <th>Description</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="videoTableBody">

            </tbody>
        </table>
    </main>

    <script src="/static/index.js"></script>
</body>
</html>
